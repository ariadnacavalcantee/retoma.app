<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Retoma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: navegação lateral fixa + área de trabalho (cabeçalho de página, barra de filtros, tabela/quadro); no celular a lateral vira gaveta sob uma barra superior. */
:root{
  --bg:#F6F5FA; --surface:#FFFFFF; --surface-2:#F0EEF7; --border:#E4E1EC; --border-strong:#CDC8DB;
  --fg:#1B1925; --fg-2:#46425A; --muted:#6D6883;
  --accent:#6A3FD6; --accent-hover:#5A30C0; --accent-ink:#FFFFFF; --accent-soft:#EFE9FD; --accent-line:#D8CDF8;
  --ok:#1C7A52; --ok-soft:#E2F3EA; --warn:#9A5B0C; --warn-soft:#FBF0DD; --danger:#BE3A30; --danger-soft:#FBE8E6; --danger-ink:#FFFFFF;
  --info:#2D5BB0; --info-soft:#E6EEFB;
  --shadow:0 1px 2px rgba(28,20,58,.06),0 10px 30px rgba(28,20,58,.10);
  --overlay:rgba(22,17,36,.44);
  --skel:#ECEAF3;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121019; --surface:#1A1723; --surface-2:#231F2F; --border:#2F2A3D; --border-strong:#423B55;
  --fg:#EDEBF4; --fg-2:#C9C5D8; --muted:#9A95AF;
  --accent:#A88BFF; --accent-hover:#BBA3FF; --accent-ink:#170F2E; --accent-soft:#2A2246; --accent-line:#433873;
  --ok:#4FC48D; --ok-soft:#173226; --warn:#E3A84E; --warn-soft:#352813; --danger:#F07D74; --danger-soft:#3A1B19; --danger-ink:#2A0E0B;
  --info:#7FA7F2; --info-soft:#1A2640;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 36px rgba(0,0,0,.45);
  --overlay:rgba(5,4,10,.6); --skel:#26222F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121019; --surface:#1A1723; --surface-2:#231F2F; --border:#2F2A3D; --border-strong:#423B55;
  --fg:#EDEBF4; --fg-2:#C9C5D8; --muted:#9A95AF;
  --accent:#A88BFF; --accent-hover:#BBA3FF; --accent-ink:#170F2E; --accent-soft:#2A2246; --accent-line:#433873;
  --ok:#4FC48D; --ok-soft:#173226; --warn:#E3A84E; --warn-soft:#352813; --danger:#F07D74; --danger-soft:#3A1B19; --danger-ink:#2A0E0B;
  --info:#7FA7F2; --info-soft:#1A2640;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 36px rgba(0,0,0,.45);
  --overlay:rgba(5,4,10,.6); --skel:#26222F; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--fg)}
h1{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.15;letter-spacing:-.02em}
h2{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.3;letter-spacing:-.01em}
h3{font-size:14px;font-weight:650}
p{margin:0}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px;gap:5px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn.block{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.link-btn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:600;color:var(--fg-2)}
.req{color:var(--danger)}
.input,select.input,textarea.input{width:100%;height:40px;padding:0 12px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);color:var(--fg);font-size:14px}
textarea.input{height:auto;padding:10px 12px;line-height:1.55;resize:vertical}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input[aria-invalid="true"]{border-color:var(--danger)}
.err{color:var(--danger);font-size:12.5px;font-weight:500}
.hint{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form{display:flex;flex-direction:column;gap:16px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);cursor:pointer}
.check input{width:18px;height:18px;margin-top:1px;accent-color:var(--accent);flex:none}
.check strong{display:block;font-size:13.5px}
.form-alert{padding:10px 12px;border-radius:9px;background:var(--danger-soft);color:var(--danger);font-weight:500;font-size:13px}

/* ---------- Shell ---------- */
.app{display:flex;min-height:100%}
.side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));gap:4px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.03em;color:var(--fg)}
.brand svg{width:28px;height:28px;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;border:0;background:none;color:var(--fg-2);font-weight:500;cursor:pointer;text-align:left;width:100%}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav-btn .count{margin-left:auto;font-size:11px;font-weight:700;background:var(--danger);color:var(--danger-ink);border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);padding:14px 8px 0}
.clinic-chip{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;flex:none}
.clinic-chip .t{min-width:0}
.clinic-chip strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clinic-chip span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.mtop{display:none}
.side-scrim{display:none}
.demo-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);color:var(--fg-2);font-size:13px;border-bottom:1px solid var(--accent-line);padding-block:8px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.demo-banner strong{color:var(--accent)}
.page{padding-block:28px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1320px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph .sub{color:var(--muted);margin-top:4px}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Cards / KPIs ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-h .hint{font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k-l{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.kpi .k-v{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-s{font-size:12.5px;color:var(--fg-2)}
.kpi .k-s b{font-weight:650}
.kpi.hl{border-color:var(--accent-line);background:linear-gradient(var(--accent-soft),var(--surface) 70%)}
.kpi .late{color:var(--danger);font-weight:650}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:10px}
.f-row{display:grid;grid-template-columns:132px minmax(0,1fr) 34px;align-items:center;gap:10px;font-size:13px}
.f-row .f-l{color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.f-bar{height:100%;border-radius:99px;background:var(--accent);min-width:2px}
.f-row[data-s="convertido"] .f-bar{background:var(--ok)}
.f-row[data-s="perdido"] .f-bar{background:var(--border-strong)}
.f-row .f-n{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.f-foot{display:flex;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;color:var(--fg-2);flex-wrap:wrap}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--border);min-width:0}
.row:first-child{border-top:0;padding-top:2px}
.row .r-main{flex:1;min-width:0}
.row .r-main strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r-main span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r-act{display:flex;gap:6px;flex:none}
.lead-link{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--fg);font-weight:600}
.lead-link:hover{color:var(--accent)}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--fg-2)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.badge.s-orcamento{background:var(--accent-soft);color:var(--accent)}
.badge.s-aguardando{background:var(--warn-soft);color:var(--warn)}
.badge.s-negociacao{background:var(--info-soft);color:var(--info)}
.badge.s-convertido{background:var(--ok-soft);color:var(--ok)}
.badge.s-perdido{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:650;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.due{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--fg-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.due.late{color:var(--danger)}
.due.today{color:var(--accent)}
.due.none{color:var(--muted);font-weight:500}

/* ---------- Toolbar & table ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 260px;min-width:0}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:34px}
.toolbar select.input{width:auto;flex:0 1 auto;max-width:100%}
.result-meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td .sub{display:block;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
td.money{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
td.acts{text-align:right;white-space:nowrap}
.consent{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ok)}
.consent.no{color:var(--warn)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:420px;color:var(--fg-2)}

/* ---------- States ---------- */
.sk{background:var(--skel);border-radius:8px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.sk-line{height:14px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:44px 20px;color:var(--muted)}
.empty .e-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:4px}
.empty strong{color:var(--fg);font-size:15px}
.empty p{max-width:420px}
.empty .btn{margin-top:8px}
.empty.sm{padding:22px 10px}
.error-box{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:12px;background:var(--danger-soft);color:var(--danger)}
.error-box strong{display:block;color:var(--fg)}
.error-box p{color:var(--fg-2);margin:2px 0 10px}
.info-box{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--info-soft);color:var(--fg-2);font-size:13px}
.info-box .ic{color:var(--info);margin-top:1px}
.warn-box{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--fg-2);font-size:13px}
.warn-box .ic{color:var(--warn);margin-top:1px}

/* ---------- Pipeline ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.k-col{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px;transition:border-color .15s,background .15s}
.k-col.over{border-color:var(--accent);background:var(--accent-soft)}
.k-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 6px}
.k-head .k-sum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.k-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.k-card:hover{border-color:var(--border-strong)}
.k-card.dragging{opacity:.5}
.k-card .k-n{font-weight:650}
.k-card .k-meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.k-card .k-val{font-weight:650;color:var(--fg);font-variant-numeric:tabular-nums}
.k-card select{height:30px;font-size:12.5px;padding:0 8px;border-radius:7px}
.k-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:18px 6px;border:1px dashed var(--border-strong);border-radius:10px}

/* ---------- Agenda ---------- */
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;align-self:flex-start;max-width:100%;overflow-x:auto}
.seg-btn{border:0;background:none;padding:6px 14px;border-radius:7px;font-weight:600;color:var(--fg-2);cursor:pointer;white-space:nowrap}
.seg-btn.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.group{display:flex;flex-direction:column;gap:8px}
.group-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.group-h.late{color:var(--danger)}
.fu{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.fu .fu-when{display:flex;flex-direction:column;gap:2px}
.fu .fu-when small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fu .fu-main{min-width:0}
.fu .fu-main .meta{font-size:12.5px;color:var(--muted)}
.fu .fu-note{font-size:13px;color:var(--fg-2);margin-top:2px}
.fu .fu-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fu.compact{grid-template-columns:minmax(0,1fr);gap:8px;padding:10px 12px}
.fu.compact .fu-act{justify-content:flex-start}

/* ---------- Overlays ---------- */
.overlay-root{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#drawer-root{z-index:40;justify-content:flex-end;padding:0}
#confirm-root{z-index:60}
.scrim{position:absolute;inset:0;background:var(--overlay)}
.modal{position:relative;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:560px;max-height:calc(100% - 16px);display:flex;flex-direction:column;border:1px solid var(--border)}
.modal.lg{max-width:720px}
.modal.sm{max-width:420px}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 12px 20px}
.m-body{padding:4px 20px 18px;overflow-y:auto;min-height:0}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.drawer{position:relative;height:100%;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.d-in{padding:20px 22px 28px;display:flex;flex-direction:column;gap:20px}
.d-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.eyebrow{font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.d-head h2{font-size:21px;margin-top:2px}
.d-head .meta{color:var(--fg-2);margin-top:2px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap}
.d-sec{display:flex;flex-direction:column;gap:10px}
.d-sec .sec-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:9px 12px;margin:0;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.selectable{user-select:all;font-variant-numeric:tabular-nums}
.msg-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.msg-item .mi-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.msg-item p{font-size:13px;color:var(--fg-2);white-space:pre-wrap}

/* composer */
.comp{display:flex;flex-direction:column;gap:14px}
.comp-to{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--surface-2);border-radius:10px;font-size:13.5px}
.tpls{display:flex;flex-wrap:wrap;gap:6px}
.tpl{border:1px solid var(--border-strong);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--fg-2);cursor:pointer}
.tpl[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.comp-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.after{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid var(--ok);background:var(--ok-soft)}
.after .a-acts{display:flex;gap:8px;flex-wrap:wrap}
.var-chips{display:flex;gap:6px;flex-wrap:wrap}
.var-chip{border:1px dashed var(--accent-line);background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600;cursor:pointer;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.preview{padding:12px 14px;border-radius:12px 12px 12px 4px;background:var(--ok-soft);color:var(--fg);white-space:pre-wrap;font-size:13.5px;max-width:520px}

/* settings */
.set-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:880px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sec-desc{color:var(--fg-2);margin-bottom:16px;max-width:64ch}
.tpl-list{display:flex;flex-direction:column;gap:8px}
.tpl-item{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.tpl-item .t-b{min-width:0}
.tpl-item p{font-size:13px;color:var(--fg-2);margin-top:3px}
.checklist{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:8px}
.checklist li{display:flex;gap:10px;align-items:flex-start;color:var(--fg-2)}
.checklist .ic{color:var(--muted);margin-top:2px}
.checklist li.done .ic{color:var(--ok)}
.tech{display:grid;grid-template-columns:180px minmax(0,1fr);gap:8px 14px;font-size:13px;padding:12px 14px;background:var(--surface-2);border-radius:10px;margin-bottom:16px}
.tech dt{color:var(--muted)}
.tech dd{margin:0}

/* toasts */
#toasts{position:fixed;z-index:70;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:calc(16px + env(safe-area-inset-right,0px));left:auto;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100% - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:13.5px;box-shadow:var(--shadow);animation:tin .2s ease-out}
.toast.err{background:var(--danger);color:var(--danger-ink)}
@keyframes tin{from{transform:translateY(6px);opacity:0}}

/* ---------- Auth ---------- */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.auth-side{background:var(--surface-2);border-right:1px solid var(--border);padding-block:36px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:40px;display:flex;flex-direction:column;gap:36px;justify-content:space-between}
.auth-copy{max-width:460px;display:flex;flex-direction:column;gap:14px}
.auth-copy h1{font-size:40px;line-height:1.05;letter-spacing:-.035em}
.auth-copy p{color:var(--fg-2);font-size:15.5px;max-width:52ch}
.bubble{max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:14px 16px;box-shadow:var(--shadow)}
.bubble .b-meta{font-size:11.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.bubble p{color:var(--fg-2)}
.bubble mark{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 3px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.auth-main{display:flex;align-items:center;justify-content:center;padding-block:36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:20px}
.auth-card .ah p{color:var(--muted);margin-top:4px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.auth-note{font-size:12.5px;color:var(--muted);line-height:1.5}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
  .kpi{grid-column:span 2}
  .kpi:nth-child(n+4){grid-column:span 3}
  .dash-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .side{position:fixed;inset:0 auto 0 0;transform:translateX(-102%);transition:transform .22s ease;height:100%;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
  .app.nav-open .side{transform:none}
  .app.nav-open .side-scrim{display:block;position:fixed;inset:0;background:var(--overlay);z-index:25}
  .mtop{display:flex;align-items:center;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mtop .brand{padding:0;font-size:18px}
  .mtop .brand svg{width:24px;height:24px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .page{padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .demo-banner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth-side{border-right:0;border-bottom:1px solid var(--border);padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:18px}
  .auth-copy h1{font-size:28px}
  .bubble{display:none}
}
@media (max-width:640px){
  h1{font-size:22px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi,.kpi:nth-child(n+4){grid-column:span 1}
  .kpi:first-child{grid-column:span 2}
  .kpi .k-v{font-size:23px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .fu{grid-template-columns:minmax(0,1fr)}
  .fu .fu-act{justify-content:flex-start}
  .f-row{grid-template-columns:104px minmax(0,1fr) 30px}
  .kv,.tech{grid-template-columns:minmax(0,1fr);gap:2px 0}
  .kv dd,.tech dd{margin-bottom:8px}
  .toolbar select.input{flex:1 1 calc(50% - 4px)}
  .overlay-root:not(#drawer-root){align-items:flex-end;padding:0}
  .modal{border-radius:16px 16px 0 0;max-height:94%;padding-bottom:env(safe-area-inset-bottom,0px)}
  .row{flex-wrap:wrap}
  .row .r-act{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="drawer-root" class="overlay-root" hidden></div>
<div id="modal-root" class="overlay-root" hidden></div>
<div id="confirm-root" class="overlay-root" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/app/app.js"></script>
</body>
</html>
